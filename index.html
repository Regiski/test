<!DOCTYPE html>
<html lang="it">

    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;

            box-sizing: border-box;

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;

        /* Print Styles */
        @media print {

            .container {
                display: none;

                grid-template-columns: 1fr;

    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel -->
        <div class="left-panel">
            <div class="header">
                <h1>🏷️ Generatore Etichette</h1>
                <p>Crea etichette professionali per scaffale</p>
            </div>

            <div class="form-section">
                <form id="productForm">
                    <div class="form-group">
                        <label>Nome Prodotto *</label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label>Marca</label>
                        <input type="text" id="marca">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Prezzo (€) *</label>
                            <input type="number" id="prezzo" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Quantità *</label>
                            <input type="number" id="quantita" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Unità *</label>
                        <select id="unita" required>
                            <option value="g">g (grammi)</option>
                            <option value="kg">kg (chilogrammi)</option>
                            <option value="ml">ml (millilitri)</option>
                            <option value="l">l (litri)</option>
                            <option value="pz">pz (pezzi)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Descrizione</label>
                        <textarea id="descrizione" rows="2"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Ingredienti</label>
                        <textarea id="ingredienti" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Allergeni</label>
                        <input type="text" id="allergeni" placeholder="es. Glutine, Latte, Uova">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Origine</label>
                            <input type="text" id="origine">
                        </div>
                        <div class="form-group">
                            <label>Lotto</label>
                            <input type="text" id="lotto">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Scadenza</label>
                            <input type="date" id="scadenza">
                        </div>
                        <div class="form-group">
                            <label>EAN</label>
                            <input type="text" id="ean">
                        </div>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="promo">
                        <label for="promo">Prodotto in Promozione</label>
                    </div>

                    <div class="form-group" id="prezzoPromoGroup" style="display: none; margin-top: 12px;">
                        <label>Prezzo Promo (€)</label>
                        <input type="number" id="prezzoPromo" step="0.01">
                    </div>

                    <div class="button-group">
                        <button type="button" class="btn btn-secondary" id="nuovoBtn">Nuovo</button>
                        <button type="submit" class="btn btn-primary" id="salvaBtn">Aggiungi</button>
                    </div>

                    <div class="csv-actions">
                        <button type="button" class="btn btn-secondary" id="importBtn">Importa CSV</button>
                        <button type="button" class="btn btn-secondary" id="exportBtn">Esporta CSV</button>
                    </div>
                    <input type="file" id="fileInput" class="file-input" accept=".csv">
                </form>
            </div>

            <div class="products-section">
                <input type="text" id="searchBox" class="search-box" placeholder="🔍 Cerca prodotto...">
                <div id="productsList"></div>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right-panel">
            <div class="preview-header">
                <h2>Anteprima Etichetta</h2>
                <div class="template-selector">
                    <label>Template:</label>
                    <select id="templateSelector">
                        <option value="classica">Classica</option>
                        <option value="promo">Promo</option>
                        <option value="bio">Bio/Artigianale</option>
                    </select>
                </div>
            </div>

            <div class="label-preview">
                <div id="labelPreview" class="label classica">
                    <div class="empty-state">
                        <p>Seleziona o crea un prodotto<br>per vedere l'anteprima</p>
                    </div>
                </div>
            </div>

            <div class="print-actions">
                <button class="btn btn-success" id="printBtn">🖨️ Genera Foglio Stampa</button>
            </div>
        </div>
    </div>

    <!-- Print Sheet (hidden, visible only on print) -->
    <div class="print-sheet" id="printSheet"></div>

    <script>
        // State
        let products = [];
        let selectedProductId = null;
        let editMode = false;

        // Load products from localStorage
        function loadProducts() {
            const saved = localStorage.getItem('products');
            if (saved) {
                products = JSON.parse(saved);
            }
        }

        // Save products to localStorage
        function saveProducts() {
            localStorage.setItem('products', JSON.stringify(products));
        }

        // Generate unique ID
        function generateId() {
            return Date.now() + Math.random().toString(36).substr(2, 9);
        }

        // Format price
        function formatPrice(price) {
            return new Intl.NumberFormat('it-IT', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(price);
        }

        // Calculate unit price
        function calculateUnitPrice(price, quantity, unit) {
            let unitPrice = 0;
            let unitLabel = '';

            switch(unit) {
                case 'g':
                    unitPrice = price / (quantity / 1000);
                    unitLabel = '€/kg';
                    break;
                case 'kg':
                    unitPrice = price / quantity;
                    unitLabel = '€/kg';
                    break;
                case 'ml':
                    unitPrice = price / (quantity / 1000);
                    unitLabel = '€/L';
                    break;
                case 'l':
                    unitPrice = price / quantity;
                    unitLabel = '€/L';
                    break;
                case 'pz':
                    unitPrice = price / quantity;
                    unitLabel = '€/pz';
                    break;
            }

            return { unitPrice, unitLabel };
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Render products list
        function renderProductsList() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filteredProducts = products.filter(p => 
                p.nome.toLowerCase().includes(searchTerm) ||
                (p.marca && p.marca.toLowerCase().includes(searchTerm))
            );

            const listHtml = filteredProducts.map(product => `
                <div class="product-item ${selectedProductId === product.id ? 'active' : ''}" data-id="${product.id}">
                    <h4>${product.nome}</h4>
                    <p>${product.marca || 'Senza marca'} • ${formatPrice(product.prezzo)} € • ${product.quantita} ${product.unita}</p>
                    <div class="product-actions">
                        <button class="btn btn-secondary btn-small edit-btn">Modifica</button>
                        <button class="btn btn-secondary btn-small duplicate-btn">Duplica</button>
                        <button class="btn btn-danger btn-small delete-btn">Elimina</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('productsList').innerHTML = listHtml || '<p style="text-align: center; color: #999; padding: 20px;">Nessun prodotto trovato</p>';

            // Attach event listeners
            document.querySelectorAll('.product-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn')) {
                        selectProduct(item.dataset.id);
                    }
                });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.target.closest('.product-item').dataset.id;
                    editProduct(id);
                });
            });

            document.querySelectorAll('.duplicate-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.target.closest('.product-item').dataset.id;
                    duplicateProduct(id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.target.closest('.product-item').dataset.id;
                    deleteProduct(id);
                });
            });
        }

        // Select product
        function selectProduct(id) {
            selectedProductId = id;
            renderProductsList();
            renderLabelPreview();
        }

        // Edit product
        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('nome').value = product.nome;
            document.getElementById('marca').value = product.marca || '';
            document.getElementById('prezzo').value = product.prezzo;
            document.getElementById('quantita').value = product.quantita;
            document.getElementById('unita').value = product.unita;
            document.getElementById('descrizione').value = product.descrizione || '';
            document.getElementById('ingredienti').value = product.ingredienti || '';
            document.getElementById('allergeni').value = product.allergeni || '';
            document.getElementById('origine').value = product.origine || '';
            document.getElementById('lotto').value = product.lotto || '';
            document.getElementById('scadenza').value = product.scadenza || '';
            document.getElementById('ean').value = product.ean || '';
            document.getElementById('promo').checked = product.promo || false;
            document.getElementById('prezzoPromo').value = product.prezzoPromo || '';

            togglePromoField();
            
            editMode = true;
            selectedProductId = id;
            document.getElementById('salvaBtn').textContent = 'Salva Modifiche';
        }

        // Duplicate product
        function duplicateProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const newProduct = {
                ...product,
                id: generateId(),
                nome: product.nome + ' (Copia)'
            };

            products.push(newProduct);
            saveProducts();
            renderProductsList();
            showToast('Prodotto duplicato!');
        }

        // Delete product
        function deleteProduct(id) {
            if (!confirm('Sei sicuro di voler eliminare questo prodotto?')) return;

            products = products.filter(p => p.id !== id);
            if (selectedProductId === id) {
                selectedProductId = null;
            }
            saveProducts();
            renderProductsList();
            renderLabelPreview();
            showToast('Prodotto eliminato!');
        }

        // Render label preview
        function renderLabelPreview() {
            const labelEl = document.getElementById('labelPreview');
            
            if (!selectedProductId) {
                labelEl.innerHTML = '<div class="empty-state"><p>Seleziona o crea un prodotto<br>per vedere l\'anteprima</p></div>';
                return;
            }

            const product = products.find(p => p.id === selectedProductId);
            if (!product) return;

            const template = document.getElementById('templateSelector').value;
            const { unitPrice, unitLabel } = calculateUnitPrice(product.prezzo, product.quantita, product.unita);

            let priceHtml = '';
            if (product.promo && product.prezzoPromo) {
                const [integerPromo, decimalPromo] = formatPrice(product.prezzoPromo).split(',');
                const priceOld = formatPrice(product.prezzo);
                priceHtml = `
                    <div class="label-price-section">
                        <span class="label-price">${integerPromo},<span class="label-price-decimal">${decimalPromo}</span> €</span>
                        <span class="label-price-old">${priceOld} €</span>
                    </div>
                `;
            } else {
                const [integer, decimal] = formatPrice(product.prezzo).split(',');
                priceHtml = `
                    <div class="label-price-section">
                        <span class="label-price">${integer},<span class="label-price-decimal">${decimal}</span> €</span>
                    </div>
                `;
            }

            const unitPriceHtml = product.unita !== 'pz' ? 
                `<span class="label-price-unit">(${formatPrice(unitPrice)} ${unitLabel})</span>` : '';

            let footerItems = [];
            if (product.allergeni) footerItems.push(`Allergeni: ${product.allergeni}`);
            if (product.origine) footerItems.push(`Origine: ${product.origine}`);
            if (product.lotto) footerItems.push(`Lotto: ${product.lotto}`);
            if (product.scadenza) footerItems.push(`Scad: ${new Date(product.scadenza).toLocaleDateString('it-IT')}`);
            if (product.ean) footerItems.push(`EAN: ${product.ean}`);

            const promoBanner = (template === 'promo' && product.promo) ? 
                '<div class="promo-banner">OFFERTA</div>' : '';

            labelEl.className = `label ${template}`;
            labelEl.innerHTML = `
                ${promoBanner}
                <div class="label-header">
                    <div class="label-title">${product.nome}</div>
                    <div class="label-subtitle">${product.marca || ''} ${product.marca ? '•' : ''} ${product.quantita} ${product.unita}</div>
                </div>
                ${priceHtml}
                ${unitPriceHtml}
                ${product.descrizione ? `<div class="label-description">${product.descrizione}</div>` : ''}
                ${product.ingredienti ? `<div class="label-ingredients"><strong>Ingredienti:</strong> ${product.ingredienti}</div>` : ''}
                ${footerItems.length > 0 ? `<div class="label-footer">${footerItems.join(' • ')}</div>` : ''}
            `;
        }

        // Toggle promo field
        function togglePromoField() {
            const promoChecked = document.getElementById('promo').checked;
            document.getElementById('prezzoPromoGroup').style.display = promoChecked ? 'block' : 'none';
        }

        // Clear form
        function clearForm() {
            document.getElementById('productForm').reset();
            editMode = false;
            selectedProductId = null;
            document.getElementById('salvaBtn').textContent = 'Aggiungi';
            togglePromoField();
        }

        // Form submit
        document.getElementById('productForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const formData = {
                nome: document.getElementById('nome').value,
                marca: document.getElementById('marca').value,
                prezzo: parseFloat(document.getElementById('prezzo').value),
                quantita: parseFloat(document.getElementById('quantita').value),
                unita: document.getElementById('unita').value,
                descrizione: document.getElementById('descrizione').value,
                ingredienti: document.getElementById('ingredienti').value,
                allergeni: document.getElementById('allergeni').value,
                origine: document.getElementById('origine').value,
                lotto: document.getElementById('lotto').value,
                scadenza: document.getElementById('scadenza').value,
                ean: document.getElementById('ean').value,
                promo: document.getElementById('promo').checked,
                prezzoPromo: document.getElementById('prezzoPromo').value ? parseFloat(document.getElementById('prezzoPromo').value) : null
            };

            if (editMode && selectedProductId) {
                const index = products.findIndex(p => p.id === selectedProductId);
                products[index] = { ...products[index], ...formData };
                showToast('Prodotto aggiornato!');
            } else {
                formData.id = generateId();
                products.push(formData);
                selectedProductId = formData.id;
                showToast('Prodotto aggiunto!');
            }

            saveProducts();
            renderProductsList();
            renderLabelPreview();
            clearForm();
        });

        // New button
        document.getElementById('nuovoBtn').addEventListener('click', clearForm);

        // Promo checkbox
        document.getElementById('promo').addEventListener('change', togglePromoField);

        // Search box
        document.getElementById('searchBox').addEventListener('input', renderProductsList);

        // Template selector
        document.getElementById('templateSelector').addEventListener('change', renderLabelPreview);

        // Export CSV
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (products.length === 0) {
                showToast('Nessun prodotto da esportare', 'error');
                return;
            }

            const headers = 'nome,marca,prezzo,quantita,unita,ingredienti,descrizione,allergeni,origine,lotto,scadenza,ean,promo,prezzoPromo\n';
            const rows = products.map(p => {
                return [
                    `"${p.nome}"`,
                    `"${p.marca || ''}"`,
                    p.prezzo,
                    p.quantita,
                    p.unita,
                    `"${(p.ingredienti || '').replace(/"/g, '""')}"`,
                    `"${(p.descrizione || '').replace(/"/g, '""')}"`,
                    `"${p.allergeni || ''}"`,
                    `"${p.origine || ''}"`,
                    `"${p.lotto || ''}"`,
                    p.scadenza || '',
                    `"${p.ean || ''}"`,
                    p.promo ? '1' : '0',
                    p.prezzoPromo || ''
                ].join(',');
            }).join('\n');

            const csv = headers + rows;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `prodotti_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();

            showToast('CSV esportato con successo!');
        });

        // Import CSV
        document.getElementById('importBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const csv = event.target.result;
                const lines = csv.split('\n').filter(line => line.trim());
                
                if (lines.length < 2) {
                    showToast('File CSV vuoto o non valido', 'error');
                    return;
                }

                const headers = lines[0].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
                let imported = 0;
                let errors = 0;

                for (let i = 1; i < lines.length; i++) {
                    const values = lines[i].split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(v => v.replace(/^"|"$/g, '').replace(/""/g, '"'));
                    
                    try {
                        const product = {
                            id: generateId(),
                            nome: values[0] || '',
                            marca: values[1] || '',
                            prezzo: parseFloat(values[2]) || 0,
                            quantita: parseFloat(values[3]) || 0,
                            unita: values[4] || 'pz',
                            ingredienti: values[5] || '',
                            descrizione: values[6] || '',
                            allergeni: values[7] || '',
                            origine: values[8] || '',
                            lotto: values[9] || '',
                            scadenza: values[10] || '',
                            ean: values[11] || '',
                            promo: values[12] === '1',
                            prezzoPromo: values[13] ? parseFloat(values[13]) : null
                        };

                        if (product.nome && product.prezzo > 0 && product.quantita > 0) {
                            products.push(product);
                            imported++;
                        } else {
                            errors++;
                        }
                    } catch (err) {
                        errors++;
                    }
                }

                saveProducts();
                renderProductsList();
                
                showToast(`Import completato: ${imported} prodotti importati${errors > 0 ? `, ${errors} errori` : ''}`, errors > 0 ? 'error' : 'success');
                
                e.target.value = '';
            };

            reader.readAsText(file);
        });

        // Print sheet
        document.getElementById('printBtn').addEventListener('click', () => {
            if (products.length === 0) {
                showToast('Nessun prodotto da stampare', 'error');
                return;
            }

            const template = document.getElementById('templateSelector').value;
            const printSheet = document.getElementById('printSheet');
            
            let html = '';
            products.forEach((product, index) => {
                const { unitPrice, unitLabel } = calculateUnitPrice(product.prezzo, product.quantita, product.unita);

                let priceHtml = '';
                if (product.promo && product.prezzoPromo) {
                    const [integerPromo, decimalPromo] = formatPrice(product.prezzoPromo).split(',');
                    const priceOld = formatPrice(product.prezzo);
                    priceHtml = `
                        <div class="label-price-section">
                            <span class="label-price">${integerPromo},<span class="label-price-decimal">${decimalPromo}</span> €</span>
                            <span class="label-price-old">${priceOld} €</span>
                        </div>
                    `;
                } else {
                    const [integer, decimal] = formatPrice(product.prezzo).split(',');
                    priceHtml = `
                        <div class="label-price-section">
                            <span class="label-price">${integer},<span class="label-price-decimal">${decimal}</span> €</span>
                        </div>
                    `;
                }

                const unitPriceHtml = product.unita !== 'pz' ? 
                    `<span class="label-price-unit">(${formatPrice(unitPrice)} ${unitLabel})</span>` : '';

                let footerItems = [];
                if (product.allergeni) footerItems.push(`Allergeni: ${product.allergeni}`);
                if (product.origine) footerItems.push(`Origine: ${product.origine}`);
                if (product.lotto) footerItems.push(`Lotto: ${product.lotto}`);
                if (product.scadenza) footerItems.push(`Scad: ${new Date(product.scadenza).toLocaleDateString('it-IT')}`);
                if (product.ean) footerItems.push(`EAN: ${product.ean}`);

                const promoBanner = (template === 'promo' && product.promo) ? 
                    '<div class="promo-banner">OFFERTA</div>' : '';

                html += `
                    <div class="label ${template}">
                        ${promoBanner}
                        <div class="label-header">
                            <div class="label-title">${product.nome}</div>
                            <div class="label-subtitle">${product.marca || ''} ${product.marca ? '•' : ''} ${product.quantita} ${product.unita}</div>
                        </div>
                        ${priceHtml}
                        ${unitPriceHtml}
                        ${product.descrizione ? `<div class="label-description">${product.descrizione}</div>` : ''}
                        ${product.ingredienti ? `<div class="label-ingredients"><strong>Ingredienti:</strong> ${product.ingredienti}</div>` : ''}
                        ${footerItems.length > 0 ? `<div class="label-footer">${footerItems.join(' • ')}</div>` : ''}
                    </div>
                `;

                // Page break after every 10 labels
                if ((index + 1) % 10 === 0 && index < products.length - 1) {
                    html += '<div class="page-break"></div>';
                }
            });

            printSheet.innerHTML = html;
            
            setTimeout(() => {
                window.print();
            }, 100);
        });

        // Initialize
        loadProducts();
        renderProductsList();
        renderLabelPreview();
    </script>
</body>
</html>
